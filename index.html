<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبورة التكتيك والمباراة الحية - نمط المدرب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #0b132b; color: #f8fafc; user-select: none; }
    
    .pitch-board {
      background-color: #0d5c3a;
      background-image: 
        linear-gradient(to bottom, rgba(255,255,255,0.05) 50%, transparent 50%),
        radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.35) 100%);
      background-size: 100% 60px, 100% 100%;
    }

    .player-token {
      touch-action: none;
      cursor: grab;
    }
    .player-token:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    canvas { touch-action: none; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center z-20">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-clipboard-user text-emerald-400 text-2xl"></i>
      <h1 class="text-xl font-bold text-white">منصة التكتيك التفاعلية - غطاء المدرب (Coach Mode)</h1>
    </div>

    <!-- Tab Selection -->
    <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-bold gap-1">
      <button id="nav-tactics" onclick="switchTab('tactics')" class="px-4 py-2 rounded-lg bg-emerald-600 text-white shadow">
        <i class="fa-solid fa-chalkboard ml-1"></i> سبورة التكتيك والرسم
      </button>
      <button id="nav-match" onclick="switchTab('match')" class="px-4 py-2 rounded-lg text-slate-300 hover:text-white">
        <i class="fa-solid fa-futbol ml-1"></i> تطبيق التكتيك في المباراة الحية
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- TAB 1: TACTICS BOARD -->
    <section id="tab-tactics" class="flex-1 flex p-4 gap-4 w-full h-full">
      <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 flex flex-col relative overflow-hidden">
        
        <!-- Toolbar -->
        <div class="p-3 bg-slate-950/90 border-b border-slate-800 flex justify-between items-center text-xs z-10 flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <button onclick="setTool('arrow')" id="tool-arrow" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center gap-1 shadow">
              <i class="fa-solid fa-long-arrow-alt-up"></i> سهم تحرك
            </button>
            <button onclick="setTool('pass')" id="tool-pass" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold flex items-center gap-1">
              <i class="fa-solid fa-ellipsis-h"></i> خط تمرير
            </button>
            <button onclick="setTool('zone')" id="tool-zone" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold flex items-center gap-1">
              <i class="fa-regular fa-circle"></i> منطقة تكتل
            </button>
            <div class="h-5 w-px bg-slate-700 mx-1"></div>
            <button onclick="clearCanvas()" class="px-3 py-1.5 rounded-lg bg-red-600/80 hover:bg-red-600 text-white font-bold">
              <i class="fa-solid fa-trash ml-1"></i> مسح الخطوط
            </button>
          </div>

          <div class="flex items-center gap-3">
            <button onclick="resetPositions()" class="text-emerald-400 font-bold hover:underline">
              <i class="fa-solid fa-rotate-right ml-1"></i> إعادة التشكيلة
            </button>
          </div>
        </div>

        <!-- Field Canvas -->
        <div id="board-container" class="flex-1 pitch-board relative m-3 rounded-xl border-2 border-white/20 overflow-hidden">
          <div class="absolute inset-x-0 top-0 h-28 border-b-2 border-white/20 w-64 mx-auto"></div>
          <div class="absolute inset-x-0 bottom-0 h-28 border-t-2 border-white/20 w-64 mx-auto"></div>
          <div class="absolute top-1/2 inset-x-0 border-t-2 border-white/20 -translate-y-1/2"></div>
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-36 h-36 border-2 border-white/20 rounded-full"></div>

          <canvas id="paint-canvas" class="absolute inset-0 z-20"></canvas>
          <div id="players-layer" class="absolute inset-0 z-30 pointer-events-none"></div>
        </div>
      </div>

      <!-- Squad List Sidebar -->
      <div class="w-72 bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col gap-4">
        <h3 class="font-bold text-lg border-b border-slate-800 pb-2 text-emerald-400 flex items-center justify-between">
          <span>التشكيلة الأساسية (11)</span>
          <i class="fa-solid fa-users text-sm"></i>
        </h3>
        <div id="squad-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
      </div>
    </section>

    <!-- TAB 2: LIVE MATCH ENGINE -->
    <section id="tab-match" class="hidden flex-1 p-4 flex gap-4 w-full h-full">
      <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
        
        <!-- Scoreboard -->
        <div class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center font-bold">فريقك</div>
            <span class="font-bold text-white">تطبيق الخطوط التكتيكية</span>
          </div>
          <div class="text-center">
            <div id="match-score" class="text-3xl font-black text-amber-400 font-mono">0 - 0</div>
            <div id="match-time" class="text-xs text-slate-400">الدقيقة: 0'</div>
          </div>
          <div class="font-bold text-slate-300">الخصم المنافس</div>
        </div>

        <!-- Pitch with Applied Tactical Lines & Live Players -->
        <div id="match-pitch" class="flex-1 pitch-board relative m-3 rounded-xl border-2 border-white/20 overflow-hidden">
          <canvas id="match-tactics-canvas" class="absolute inset-0 z-10 opacity-70"></canvas>
          <div id="match-players-layer" class="absolute inset-0 z-20 pointer-events-none"></div>
          <div id="match-ball" class="absolute w-4 h-4 bg-white rounded-full shadow-lg border border-black z-30 transition-all duration-300 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        </div>

        <!-- Controls -->
        <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-center gap-4">
          <button id="btn-start-match" onclick="runRealisticMatch()" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-play"></i> انطلاق خطتك في المباراة
          </button>
        </div>
      </div>

      <!-- Live Commentary & Analysis -->
      <div class="w-80 bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col">
        <h3 class="font-bold text-lg border-b border-slate-800 pb-2 mb-3 text-emerald-400 flex items-center justify-between">
          <span>تحليل تطبيق التكتيك</span>
          <i class="fa-solid fa-chart-line text-sm"></i>
        </h3>
        <div id="match-logs" class="flex-1 bg-slate-950 rounded-xl p-3 border border-slate-800 overflow-y-auto text-xs space-y-2 text-slate-300">
          <div class="text-slate-500">قم برسم خططك بالأسهم والتمريرات في سبورة التكتيك، ثم اضغط على انطلاق خطتك لمشاهدة التكتيك ينجح أو يفشل!</div>
        </div>
      </div>
    </section>

  </main>

  <script>
    let squad = [
      { id: 1, name: 'بونو', pos: 'GK', num: 1, x: 50, y: 88 },
      { id: 2, name: 'دراغر', pos: 'RB', num: 2, x: 82, y: 70 },
      { id: 3, name: 'الشيخاوي', pos: 'CB', num: 3, x: 62, y: 76 },
      { id: 4, name: 'علايلات', pos: 'CB', num: 4, x: 38, y: 76 },
      { id: 5, name: 'عرعار', pos: 'LB', num: 12, x: 18, y: 70 },
      { id: 6, name: 'كاستيلو', pos: 'CDM', num: 6, x: 50, y: 58 },
      { id: 7, name: 'الحاج محمود', pos: 'CM', num: 20, x: 68, y: 44 },
      { id: 8, name: 'كوناتي', pos: 'CM', num: 17, x: 32, y: 44 },
      { id: 9, name: 'ريبيرو', pos: 'RW', num: 10, x: 78, y: 24 },
      { id: 10, name: 'المستوري', pos: 'ST', num: 9, x: 50, y: 16 },
      { id: 11, name: 'البلايلي', pos: 'LW', num: 11, x: 22, y: 24 }
    ];

    let currentTool = 'arrow';
    let canvas, ctx, matchCanvas, matchCtx;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let drawnShapes = [];

    function init() {
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      matchCanvas = document.getElementById('match-tactics-canvas');
      matchCtx = matchCanvas.getContext('2d');

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      renderPlayers();
      renderSquadList();
      setupDrawingEvents();
    }

    function switchTab(tab) {
      ['tactics', 'match'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
        document.getElementById('nav-' + t).className = "px
