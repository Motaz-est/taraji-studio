<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي ألغاز الترجي - غول إفريقيا</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        estRed: '#E60000',
                        estGold: '#D4AF37',
                        estDark: '#121318'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0C10; color: #F3F4F6; }
        .gold-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-[#0B0C10]">

    <!-- Container -->
    <div class="max-w-xl w-full bg-[#121318] border border-estGold/30 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 gold-glow">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-estRed to-estGold flex items-center justify-center text-white text-xl font-black shadow-lg">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg text-white">مسابقة ألغاز الترجي الرياضي</h1>
                    <p class="text-xs text-estGold">اختبر معلوماتك الكروية عن غول إفريقيا</p>
                </div>
            </div>
            <div id="scoreBox" class="bg-black/60 px-4 py-2 rounded-xl border border-estGold/25 text-xs font-bold text-estGold">
                النقاط: <span id="scoreVal" class="text-white text-sm font-black">0</span>
            </div>
        </div>

        <!-- Quiz Box -->
        <div id="quizContainer" class="space-y-6">
            <div class="flex items-center justify-between text-xs text-gray-400 font-bold">
                <span id="questionProgress">السؤال 1 من 6</span>
                <span class="text-estRed bg-estRed/10 px-2.5 py-1 rounded-lg border border-estRed/20">تحدي المكشخين</span>
            </div>

            <!-- Question Text -->
            <div class="bg-black/40 p-5 rounded-2xl border border-gray-800">
                <h3 id="questionText" class="font-black text-base sm:text-lg text-white leading-relaxed">
                    جاري تحميل السؤال...
                </h3>
            </div>

            <!-- Options Grid -->
            <div id="optionsContainer" class="grid grid-cols-1 gap-3">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <!-- Result / Finished Screen -->
        <div id="resultContainer" class="hidden text-center space-y-6 py-6">
            <div class="w-20 h-20 mx-auto rounded-full bg-estGold/20 border-2 border-estGold flex items-center justify-center text-estGold text-3xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div class="space-y-2">
                <h2 id="resultTitle" class="text-2xl font-black text-white">أحسنت يا مكشخ!</h2>
                <p id="resultDesc" class="text-xs text-gray-300">أنت تعرف كل صغيرة وكبيرة عن تاريخ الترجي الرياضي.</p>
            </div>
            <div class="bg-black/60 p-4 rounded-2xl border border-estGold/30 max-w-xs mx-auto">
                <span class="text-xs text-gray-400 block">النتيجة النهائية</span>
                <span id="finalScore" class="text-3xl font-black text-estGold">6 / 6</span>
            </div>
            <button onclick="restartQuiz()" class="w-full bg-gradient-to-r from-estRed to-rose-700 hover:brightness-110 text-white font-extrabold py-3 rounded-xl transition shadow-lg text-xs">
                إعادة التحدي <i class="fa-solid fa-rotate-right ml-1"></i>
            </button>
        </div>

    </div>

    <!-- JavaScript Game Logic -->
    <script>
        const questions = [
            {
                q: "في أي سنة تأسس الترجي الرياضي التونسي (قلعة باب سويقة)؟",
                options: ["1910", "1919", "1925", "1930"],
                answer: 1
            },
            {
                q: "كم عدد ألقاب دوري أبطال إفريقيا التي توج بها الترجي في تاريخه حتى الآن؟",
                options: ["2 ألقاب", "3 ألقاب", "4 ألقاب", "5 ألقاب"],
                answer: 2
            },
            {
                q: "ما هو اللقب الشهير الذي يطلق جماهيرياً على الترجي الرياضي التونسي؟",
                options: ["الشيخ", "غول إفريقيا", "الزعيم", "المارد الأحمر"],
                answer: 1
            },
            {
                q: "في أي ملعب عريق يستقبل الترجي الرياضي التونسي مبارياته الرسمية الكبرى؟",
                options: ["ملعب زويتن", "ملعب الشاهد الحارثي", "الملعب الأولمبي برادس (حمادي العقربي)", "ملعب المنزه"],
                answer: 2
            },
            {
                q: "من هو النادي التاريخي الذي جمعته مباريات 'الديربي' الكلاسيكي الشهير ضد الترجي في تونس؟",
                options: ["النجم الساحلي", "النادي الإفريقي", "النادي الصفاقسي", "الملعب التونسي"],
                answer: 1
            },
            {
                q: "بأي لونين يتميز الزي الرسمي والتاريخي للترجي الرياضي التونسي؟",
                options: ["الأبيض والأزرق", "الأحمر والأصفر", "الأخضر والأبيض", "الأسود والأصفر"],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let lockAnswer = false;

        function loadQuestion() {
            lockAnswer = false;
            const q = questions[currentQuestion];
            document.getElementById('questionProgress').innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
            document.getElementById('questionText').innerText = q.q;

            const optionsBox = document.getElementById('optionsContainer');
            optionsBox.innerHTML = q.options.map((opt, idx) => `
                <button onclick="checkAnswer(${idx})" class="option-btn w-full text-right p-3.5 rounded-xl bg-black/60 border border-gray-800 hover:border-estGold text-xs sm:text-sm font-bold text-gray-200 transition flex items-center justify-between">
                    <span>${opt}</span>
                    <span class="w-6 h-6 rounded-full bg-gray-800 flex items-center justify-center text-[10px] text-gray-400 font-black">${['أ', 'ب', 'ج', 'د'][idx]}</span>
                </button>
            `).join('');
        }

        function checkAnswer(selectedIdx) {
            if (lockAnswer) return;
            lockAnswer = true;

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');

            if (selectedIdx === q.answer) {
                buttons[selectedIdx].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-white');
                score++;
                document.getElementById('scoreVal').innerText = score;
            } else {
                buttons[selectedIdx].classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-300');
                buttons[q.answer].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-white');
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1200);
        }

        function showResults() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `${score} / ${questions.length}`;

            const title = document.getElementById('resultTitle');
            const desc = document.getElementById('resultDesc');

            if (score === questions.length) {
                title.innerText = "أنت مكشخ حقيقي أسطوري! 🏆";
                desc.innerText = "علامة كاملة! إلمامك بتاريخ وأرقام الترجي الرياضي التونسي ممتاز جداً.";
            } else if (score >= 4) {
                title.innerText = "أداء ممتاز يا مكشخ! 🥇";
                desc.innerText = "معلوماتك القوية تعكس حبك الكبير لغول إفريقيا.";
            } else {
                title.innerText = "حاول مرة أخرى! 💪";
                desc.innerText = "يمكنك مراجعة تاريخ الترجي العريق وإعادة التحدي لتسجيل علامة كاملة.";
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            lockAnswer = false;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
