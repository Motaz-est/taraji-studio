
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي معلومات الترجي | TARAGI SOCIAL</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}
header{
  background:#a90019;
  color:white;
  text-align:center;
  padding:22px 12px;
  border-bottom:5px solid #ffd229;
}
header h1{margin:0;font-size:27px}
header span{color:#ffd229}
header p{margin:9px 0 0}
.container{
  width:min(720px,94%);
  margin:25px auto;
}
.card{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 3px 14px #00000012;
  margin-bottom:18px;
}
.stats{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.stat{
  background:#fff3d1;
  padding:12px;
  border-radius:9px;
  flex:1;
  text-align:center;
  font-weight:bold;
}
.level{
  display:inline-block;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}
.easy{background:#e0f6e7;color:#16763b}
.medium{background:#fff0c9;color:#946000}
.hard{background:#ffe1e1;color:#b00020}
.progress{
  background:#eee;
  height:9px;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}
.progress div{
  height:100%;
  width:0;
  background:#b90020;
  transition:.3s;
}
.option{
  display:block;
  width:100%;
  text-align:right;
  background:#fafafa;
  color:#222;
  border:1px solid #ddd;
  padding:14px;
  border-radius:9px;
  margin:10px 0;
  cursor:pointer;
  font-size:15px;
}
.option:hover:not(:disabled){
  border-color:#b90020;
  background:#fff3f3;
}
.option:disabled{cursor:default;opacity:1}
.correct{background:#e1f6e7!important;border-color:#16833c!important}
.wrong{background:#ffe3e3!important;border-color:#c00!important}
button.primary{
  background:#b90020;
  color:white;
  border:0;
  border-radius:9px;
  padding:13px 20px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}
button.primary:disabled{opacity:.4;cursor:default}
.feedback{
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  display:none;
  line-height:1.7;
}
#result{text-align:center}
#result h2{color:#b90020}
footer{text-align:center;color:#777;padding:20px}
</style>
</head>
<body>

<header>
  <h1>TARAGI <span>SOCIAL</span></h1>
  <p>🏆 تحدّي معلومات الترجي الرياضي التونسي</p>
</header>

<div class="container">

  <div class="card">
    <div class="stats">
      <div class="stat">⭐ النقاط: <span id="score">0</span></div>
      <div class="stat">❓ السؤال: <span id="number">1/12</span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div class="card" id="quiz">
    <span id="level" class="level easy">سهل</span>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div id="feedback" class="feedback"></div>
    <button class="primary" id="next" onclick="nextQuestion()" disabled>
      السؤال التالي
    </button>
  </div>

  <div class="card" id="result" hidden>
    <h2>🏆 انتهى التحدي!</h2>
    <h3>نتيجتك: <span id="finalScore"></span> نقطة</h3>
    <p id="message"></p>
    <button class="primary" onclick="restart()">إعادة التحدي</button>
  </div>

</div>

<footer>TARAGI SOCIAL © 2026 ❤️💛</footer>

<script>
const questions = [
 {
  level:"سهل", points:10,
  q:"في أي سنة تأسس الترجي الرياضي التونسي؟",
  options:["1919","1920","1923"], answer:0,
  explanation:"تأسس الترجي الرياضي التونسي سنة 1919."
 },
 {
  level:"سهل", points:10,
  q:"ما اللقب الشهير للترجي؟",
  options:["المكشخة","النجم","الإفريقي"], answer:0,
  explanation:"المكشخة هو اللقب المعروف لجماهير الترجي."
 },
 {
  level:"سهل", points:10,
  q:"ما اللونان التقليديان للترجي؟",
  options:["الأحمر والأصفر","الأبيض والأزرق","الأخضر والأسود"], answer:0,
  explanation:"الأحمر والأصفر هما لونا الترجي."
 },
 {
  level:"سهل", points:10,
  q:"ما اسم الملعب الذي يستضيف مباريات الترجي في رادس؟",
  options:["حمادي العقربي","المنزه","الطيب المهيري"], answer:0,
  explanation:"الملعب الأولمبي برادس يحمل اسم حمادي العقربي."
 },
 {
  level:"متوسط", points:20,
  q:"من مؤسس الترجي الرياضي التونسي؟",
  options:["محمد الزواوي","الهادي القلال","الشاذلي زويتن"], answer:0,
  explanation:"يرتبط تأسيس الترجي باسم محمد الزواوي."
 },
 {
  level:"متوسط", points:20,
  q:"كم مرة فاز الترجي بدوري أبطال إفريقيا حتى نهاية 2024؟",
  options:["3 مرات","4 مرات","5 مرات"], answer:1,
  explanation:"توج الترجي باللقب أربع مرات: 1994 و2011 و2018 و2019."
 },
 {
  level:"متوسط", points:20,
  q:"أمام أي فريق فاز الترجي بنهائي دوري الأبطال سنة 2019؟",
  options:["الوداد الرياضي","الأهلي المصري","الزمالك"], answer:0,
  explanation:"واجه الترجي الوداد الرياضي المغربي في نهائي 2019."
 },
 {
  level:"متوسط", points:20,
  q:"في أي سنة حقق الترجي أول لقب له في دوري أبطال إفريقيا؟",
  options:["1994","1997","2011"], answer:0,
  explanation:"حقق الترجي أول تتويج إفريقي سنة 1994."
 },
 {
  level:"صعب", points:30,
  q:"من كان مدرب الترجي عند الفوز بدوري أبطال إفريقيا سنة 1994؟",
  options:["يوسف الزواوي","فوزي البنزرتي","ماهر الكنزاري"], answer:0,
  explanation:"كان يوسف الزواوي مدرب الترجي في ذلك التتويج."
 },
 {
  level:"صعب", points:30,
  q:"من سجل هدفي الترجي في إياب نهائي دوري الأبطال 2018 أمام الأهلي؟",
  options:["سعد بقير وأنيس البدري","أنيس البدري والخنيسي","سعد بقير والخنيسي"], answer:0,
  explanation:"سجل سعد بقير هدفين في الفوز بثلاثية نظيفة."
 },
 {
  level:"صعب", points:30,
  q:"ما نتيجة إياب نهائي دوري الأبطال 2019 بين الترجي والوداد؟",
  options:["1-0","2-0","2-1"], answer:1,
  explanation:"فاز الترجي بهدفين دون رد في مباراة الإياب."
 },
 {
  level:"صعب", points:30,
  q:"أمام أي فريق فاز الترجي بكأس إفريقيا للأندية البطلة سنة 1994؟",
  options:["الزمالك","أسيك ميموزا","كوتون سبور"], answer:1,
  explanation:"واجه الترجي أسيك ميموزا الإيفواري في النهائي."
 }
];

let current=0;
let score=0;
let answered=false;

function showQuestion(){
 const q=questions[current];
 answered=false;

 document.getElementById("number").textContent=(current+1)+"/"+questions.length;
 document.getElementById("score").textContent=score;
 document.getElementById("bar").style.width=
   (current/questions.length*100)+"%";

 const level=document.getElementById("level");
 level.textContent=q.level;
 level.className="level "+(
   q.level==="سهل"?"easy":
   q.level==="متوسط"?"medium":"hard"
 );

 document.getElementById("question").textContent=q.q;
 document.getElementById("feedback").style.display="none";
 document.getElementById("next").disabled=true;
 document.getElementById("next").textContent=
   current===questions.length-1?"عرض النتيجة":"السؤال التالي";

 const options=document.getElementById("options");
 options.innerHTML="";

 q.options.forEach((option,index)=>{
   const button=document.createElement("button");
   button.className="option";
   button.textContent=option;
   button.onclick=()=>selectAnswer(index);
   options.appendChild(button);
 });
}

function selectAnswer(index){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const buttons=document.querySelectorAll(".option");
 const feedback=document.getElementById("feedback");

 buttons.forEach((button,i)=>{
   button.disabled=true;
   if(i===q.answer)button.classList.add("correct");
   if(i===index && index!==q.answer)button.classList.add("wrong");
 });

 if(index===q.answer){
   score+=q.points;
   feedback.textContent="✅ إجابة صحيحة! +" + q.points + " نقطة. "+q.explanation;
   feedback.style.background="#e1f6e7";
 }else{
   feedback.textContent="❌ إجابة غير صحيحة. "+q.explanation;
   feedback.style.background="#ffe3e3";
 }

 feedback.style.display="block";
 document.getElementById("score").textContent=score;
 document.getElementById("next").disabled=false;
}

function nextQuestion(){
 if(!answered)return;
 current++;
 if(current<questions.length){
   showQuestion();
 }else{
   finish();
 }
}

function finish(){
 document.getElementById("quiz").hidden=true;
 document.getElementById("result").hidden=false;
 document.getElementById("bar").style.width="100%";
 document.getElementById("finalScore").textContent=score+"/240";

 let message="";
 if(score>=200)message="ممتاز! أنت موسوعة ترجاوية حقيقية ❤️💛";
 else if(score>=130)message="نتيجة جيدة! لديك معرفة محترمة بتاريخ الترجي.";
 else message="واصل التعلم، فالتاريخ الترجّي مليء بالأسرار!";
 document.getElementById("message").textContent=message;

 const old=JSON.parse(localStorage.getItem("taragiQuizScores")||"[]");
 old.push({score:score,date:new Date().toLocaleDateString("ar-TN")});
 localStorage.setItem("taragiQuizScores",JSON.stringify(old));
}

function restart(){
 current=0;
 score=0;
 document.getElementById("quiz").hidden=false;
 document.getElementById("result").hidden=true;
 showQuestion();
}

showQuestion();
</script>
</body>
</html
