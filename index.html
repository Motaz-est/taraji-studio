<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalPulse Live - النتائج الرياضية المباشرة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        flashDark: '#121214',
                        flashCard: '#1a1a1e',
                        flashGreen: '#22c55e',
                        flashRed: '#ef4444',
                        flashOrange: '#f97316',
                        flashYellow: '#eab308',
                        flashBorder: '#27272a'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #09090b; color: #f4f4f5; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #121214; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#09090b] text-gray-100">

    <!-- Top Flashscore Header -->
    <header class="bg-[#121214] border-b border-[#27272a] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white font-black text-xl shadow-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-black text-base tracking-wider text-white">GOALPULSE <span class="text-orange-500 font-light text-xs">LIVE</span></h1>
                    <p class="text-[10px] text-gray-400">نتائج المباريات المباشرة والرياضة العالمية</p>
                </div>
            </div>

            <!-- Sports Categories Bar -->
            <div class="hidden md:flex items-center gap-2 bg-[#1a1a1e] px-3 py-1.5 rounded-xl border border-[#27272a] text-xs font-bold">
                <button class="px-3 py-1.5 rounded-lg bg-orange-600 text-white flex items-center gap-1.5"><i class="fa-solid fa-futbol"></i> كرة القدم</button>
                <button class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-basketball"></i> السلة</button>
                <button class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-baseball"></i> التنس</button>
            </div>

            <!-- Date Selector Pill -->
            <div class="flex items-center gap-2 bg-[#1a1a1e] px-3 py-2 rounded-xl border border-[#27272a] text-xs font-bold">
                <button onclick="changeDate(-1)" class="text-gray-400 hover:text-white px-1"><i class="fa-solid fa-chevron-right"></i></button>
                <span id="displayDate" class="text-orange-400 font-extrabold">اليوم، 29 أكتوبر</span>
                <button onclick="changeDate(1)" class="text-gray-400 hover:text-white px-1"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
        </div>
    </header>

    <!-- Sub Status Filters -->
    <div class="bg-[#121214] border-b border-[#27272a] py-2 px-4">
        <div class="max-w-7xl mx-auto flex items-center gap-2 text-xs font-bold overflow-x-auto">
            <button onclick="filterStatus('ALL')" id="filter-all" class="px-4 py-1.5 rounded-lg bg-orange-600 text-white whitespace-nowrap">الكل</button>
            <button onclick="filterStatus('LIVE')" id="filter-live" class="px-4 py-1.5 rounded-lg bg-[#1a1a1e] text-gray-400 hover:text-white whitespace-nowrap flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> المباشرة (Live)</button>
            <button onclick="filterStatus('FINISHED')" id="filter-finished" class="px-4 py-1.5 rounded-lg bg-[#1a1a1e] text-gray-400 hover:text-white whitespace-nowrap">المنتهية</button>
            <button onclick="filterStatus('SCHEDULED')" id="filter-scheduled" class="px-4 py-1.5 rounded-lg bg-[#1a1a1e] text-gray-400 hover:text-white whitespace-nowrap">المجدولة</button>
        </div>
    </div>

    <!-- Main Matches Container -->
    <main class="max-w-5xl mx-auto px-3 py-6 flex-1 w-full space-y-6">
        <div id="matchesContainer" class="space-y-4">
            <!-- Dynamic Matches injected by JS -->
        </div>
    </main>

    <!-- Match Details Modal -->
    <div id="matchModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1a1a1e] border border-[#27272a] rounded-3xl w-full max-w-lg p-6 space-y-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white bg-[#121214] w-8 h-8 rounded-full flex items-center justify-center border border-[#27272a]"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="modalContent" class="space-y-6">
                <!-- Content injected dynamically -->
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const matchesData = [
            {
                league: 'دوري أبطال أوروبا - دور المجموعات',
                countryFlag: '🇪🇺',
                country: 'أوروبا',
                matches: [
                    { id: 1, home: 'ريال مدريد', away: 'مانشستر سيتي', homeScore: 2, awayScore: 1, status: 'LIVE', minute: "78'", homeLogo: '👑', awayLogo: '⚡', stats: { poss: [52, 48], shots: [14, 12], yellow: [2, 3], corners: [6, 5] } },
                    { id: 2, home: 'بايرن ميونخ', away: 'باريس سان جيرمان', homeScore: 0, awayScore: 0, status: 'SCHEDULED', time: '22:00', homeLogo: '🔴', awayLogo: '🔵', stats: { poss: [50, 50], shots: [0, 0], yellow: [0, 0], corners: [0, 0] } }
                ]
            },
            {
                league: 'الدوري الإنجليزي الممتاز (Premier League)',
                countryFlag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
                country: 'إنجلترا',
                matches: [
                    { id: 3, home: 'آرسنال', away: 'ليفربول', homeScore: 3, awayScore: 2, status: 'FINISHED', time: 'FT', homeLogo: '🔴', awayLogo: '🔴', stats: { poss: [49, 51], shots: [18, 15], yellow: [1, 2], corners: [7, 4] } },
                    { id: 4, home: 'تشيلسي', away: 'مانشستر يونايتد', homeScore: 1, awayScore: 1, status: 'FINISHED', time: 'FT', homeLogo: '🔵', awayLogo: '🔴', stats: { poss: [55, 45], shots: [11, 10], yellow: [3, 3], corners: [5, 3] } }
                ]
            },
            {
                league: 'الرابطة المحترفة الأولى التونسية (الكلاسيكو)',
                countryFlag: '🇹🇳',
                country: 'تونس',
                matches: [
                    { id: 5, home: 'النادي الصفاقسي', away: 'الترجي الرياضي التونسي', homeScore: null, awayScore: null, status: 'SCHEDULED', time: '16:30', homeLogo: '🖤', awayLogo: '🟥', stats: { poss: [50, 50], shots: [0, 0], yellow: [0, 0], corners: [0, 0] } }
                ]
            }
        ];

        let currentFilter = 'ALL';

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = matchesData.map(leagueGroup => {
                const filteredMatches = leagueGroup.matches.filter(m => {
                    if (currentFilter === 'ALL') return true;
                    return m.status === currentFilter;
                });

                if (filteredMatches.length === 0) return '';

                return `
                    <div class="bg-[#121214] border border-[#27272a] rounded-2xl overflow-hidden shadow-lg">
                        <div class="bg-[#1a1a1e] px-4 py-2.5 border-b border-[#27272a] flex items-center gap-2.5 text-xs font-black">
                            <span class="text-base">${leagueGroup.countryFlag}</span>
                            <span class="text-white">${leagueGroup.country}:</span>
                            <span class="text-orange-400">${leagueGroup.league}</span>
                        </div>
                        <div class="divide-y divide-[#27272a]">
                            ${filteredMatches.map(m => `
                                <div onclick="openMatchDetails(${m.id})" class="px-4 py-3 flex items-center justify-between hover:bg-[#1a1a1e] transition cursor-pointer text-xs">
                                    <div class="flex items-center gap-3 w-1/3">
                                        <span class="text-gray-500 font-bold text-[11px] w-12 text-center">
                                            ${m.status === 'LIVE' ? `<span class="text-red-500 font-extrabold animate-pulse">${m.minute}</span>` : m.status === 'FINISHED' ? 'منتهية' : m.time}
                                        </span>
                                    </div>
                                    <div class="flex-1 space-y-1.5">
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold text-white flex items-center gap-2"><span>${m.homeLogo}</span> ${m.home}</span>
                                            <span class="font-black text-sm px-2 py-0.5 rounded ${m.status === 'LIVE' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'text-white'}">${m.homeScore !== null ? m.homeScore : '-'}</span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold text-white flex items-center gap-2"><span>${m.awayLogo}</span> ${m.away}</span>
                                            <span class="font-black text-sm px-2 py-0.5 rounded ${m.status === 'LIVE' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'text-white'}">${m.awayScore !== null ? m.awayScore : '-'}</span>
                                        </div>
                                    </div>
                                    <div class="w-12 text-left">
                                        <i class="fa-solid fa-chevron-left text-gray-500"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterStatus(status) {
            currentFilter = status;
            ['all', 'live', 'finished', 'scheduled'].forEach(s => {
                const btn = document.getElementById(`filter-${s}`);
                if(btn) btn.className = "px-4 py-1.5 rounded-lg bg-[#1a1a1e] text-gray-400 hover:text-white whitespace-nowrap";
            });
            document.getElementById(`filter-${status.toLowerCase()}`).className = "px-4 py-1.5 rounded-lg bg-orange-600 text-white whitespace-nowrap";
            renderMatches();
        }

        function openMatchDetails(id) {
            let matchObj = null;
            matchesData.forEach(g => {
                const found = g.matches.find(m => m.id === id);
                if (found) matchObj = found;
            });
            if(!matchObj) return;

            const modal = document.getElementById('matchModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="text-center space-y-3 border-b border-[#27272a] pb-4">
                    <span class="text-[10px] bg-orange-500/20 text-orange-400 px-3 py-1 rounded-full font-bold border border-orange-500/30">${matchObj.status === 'LIVE' ? 'مباراة مباشرة الآن' : matchObj.status === 'FINISHED' ? 'نتيجة نهائية' : 'مباراة مجدولة'}</span>
                    <div class="flex items-center justify-between px-6 py-2">
                        <div class="text-center space-y-1">
                            <span class="text-3xl">${matchObj.homeLogo}</span>
                            <h4 class="font-bold text-white text-sm">${matchObj.home}</h4>
                        </div>
                        <div class="px-4 py-2 bg-[#121214] rounded-xl border border-[#27272a] font-black text-xl text-orange-400">
                            ${matchObj.homeScore !== null ? `${matchObj.homeScore} - ${matchObj.awayScore}` : matchObj.time}
                        </div>
                        <div class="text-center space-y-1">
                            <span class="text-3xl">${matchObj.awayLogo}</span>
                            <h4 class="font-bold text-white text-sm">${matchObj.away}</h4>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h5 class="font-bold text-xs text-gray-400">إحصائيات المباراة المباشرة</h5>
                    <div class="space-y-3 text-xs">
                        <div>
                            <div class="flex justify-between font-bold mb-1"><span>${matchObj.stats.poss[0]}%</span><span>الاستحواذ</span><span>${matchObj.stats.poss[1]}%</span></div>
                            <div class="w-full bg-[#121214] h-2 rounded-full overflow-hidden flex"><div class="bg-orange-500 h-full" style="width: ${matchObj.stats.poss[0]}%"></div><div class="bg-gray-600 h-full" style="width: ${matchObj.stats.poss[1]}%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between font-bold mb-1"><span>${matchObj.stats.shots[0]}</span><span>التسديدات</span><span>${matchObj.stats.shots[1]}</span></div>
                            <div class="w-full bg-[#121214] h-2 rounded-full overflow-hidden flex"><div class="bg-orange-500 h-full" style="width: ${(matchObj.stats.shots[0]/(matchObj.stats.shots[0]+matchObj.stats.shots[1]||1))*100}%"></div><div class="bg-gray-600 h-full" style="width: ${(matchObj.stats.shots[1]/(matchObj.stats.shots[0]+matchObj.stats.shots[1]||1))*100}%"></div></div>
                        </div>
                        <div class="flex justify-between py-2 border-b border-[#27272a]"><span>بطاقات صفراء</span><span class="font-bold">${matchObj.stats.yellow[0]} - ${matchObj.stats.yellow[1]}</span></div>
                        <div class="flex justify-between py-2"><span>الضربات الركنية</span><span class="font-bold">${matchObj.stats.corners[0]} - ${matchObj.stats.corners[1]}</span></div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('matchModal').classList.add('hidden');
        }

        function changeDate(days) {
            // Simple visual date simulation
            document.getElementById('displayDate').innerText = days > 1 ? 'الغد، 30 أكتوبر' : days < 0 ? 'أمس، 28 أكتوبر' : 'اليوم، 29 أكتوبر';
        }

        window.onload = function() {
            renderMatches();
        };
    </script>
</body>
</html>
